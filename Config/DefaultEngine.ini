; =====================================================================================
;  TacticalDeployment - DefaultEngine.ini
;  128-tick authoritative dedicated server, Iris replication, push-model properties.
;  Server frame budget: 1 / 128 = 7.8125 ms.
; =====================================================================================

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/TacticalDeployment.TacticalGameMode
GlobalDefaultServerGameMode=/Script/TacticalDeployment.TacticalGameMode

; -------------------------------------------------------------------------------------
;  1) Tick rate. A dedicated server's frame rate is capped by NetServerMaxTickRate
;     (UGameEngine::GetMaxTickRate). Do NOT use bUseFixedFrameRate on the server: a fixed
;     DeltaTime makes simulated time drift from wall-clock time whenever a frame hitches,
;     which breaks lag compensation timestamps.
; -------------------------------------------------------------------------------------
[/Script/Engine.Engine]
bSmoothFrameRate=false
bUseFixedFrameRate=false
; Iris: allow the game net driver (and replays) to run on Iris.
!IrisNetDriverConfigs=ClearArray
+IrisNetDriverConfigs=(NetDriverDefinition=GameNetDriver,bCanUseIris=true)
+IrisNetDriverConfigs=(NetDriverDefinition=DemoNetDriver,bCanUseIris=true)
+IrisNetDriverConfigs=(NetDriverDefinition=BeaconNetDriver,bCanUseIris=false)
; Tighter near plane keeps the viewmodel from being clipped by the camera itself (Pillar 6).
NearClipPlane=2.0
; Player settings: sensitivity, crosshair, enemy outline colour, low-latency mode.
GameUserSettingsClassName=/Script/TacticalDeployment.TacticalGameUserSettings

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=128
MaxNetTickRate=128
LanServerMaxTickRate=128
; Bytes/sec per connection. 10 players * 128 Hz * ~50 B/update headroom.
MaxClientRate=150000
MaxInternetClientRate=150000
; Legacy (non-Iris) path only: close culled enemy channels quickly so the client does not
; hold a stale last-known position for the default 5 s.
RelevantTimeout=1.0
; Keep the connection timeout generous; hitches must not drop a ranked player.
ConnectionTimeout=30.0
InitialConnectTimeout=60.0

[/Script/Engine.Player]
ConfiguredInternetSpeed=150000
ConfiguredLanSpeed=150000

; -------------------------------------------------------------------------------------
;  2) Iris + push model. Iris is always compiled in (5.7+); the cvars below are what
;     actually switch replication to Iris at runtime.
; -------------------------------------------------------------------------------------
[SystemSettings]
net.Iris.UseIrisReplication=1
; Iris requires the registered sub-object list (no ReplicateSubobjects override path).
net.SubObjects.DefaultUseSubObjectReplicationList=1
net.IsPushModelEnabled=1
net.PushModelSkipUndirtiedReplication=1
; Character movement: bundle moves in the packed RPC format (smaller + Iris friendly).
p.NetUsePackedMovementRPCs=1
p.NetEnableMoveCombining=1
; Hitch-free relevancy churn on clients (fog-of-war re-reveals spawn pawns often).
net.AllowAsyncLoading=1
; Input latency: no VSync by default (UTacticalGameUserSettings applies r.GTSyncType /
; r.OneFrameThreadLag for its low-latency mode on top of this).
r.VSync=0
; Physics: full ragdolls on clients (server meshes carry no physics state, see ATacticalCharacter).
p.RagdollPhysics=1

; Iris poll rates. Pawns and weapons are polled every server frame; everything else keeps
; its own NetUpdateFrequency. Fog-of-war filtering happens *after* polling (exclusion groups).
[/Script/IrisCore.ObjectReplicationBridgeConfig]
+PollConfigs=(ClassName=/Script/TacticalDeployment.TacticalCharacter,PollFrequency=128.0,bIncludeSubclasses=true)
+PollConfigs=(ClassName=/Script/TacticalDeployment.TacticalWeapon,PollFrequency=128.0,bIncludeSubclasses=true)
+PollConfigs=(ClassName=/Script/TacticalDeployment.SpikeBase,PollFrequency=32.0,bIncludeSubclasses=true)
; Maps are small: our own occlusion-driven exclusion groups replace the spatial grid filter
; for characters. Leaving the grid on would only add a redundant per-connection pass.
+FilterConfigs=(ClassName=/Script/TacticalDeployment.TacticalCharacter,DynamicFilterName=None)
+FilterConfigs=(ClassName=/Script/TacticalDeployment.TacticalWeapon,DynamicFilterName=None)

; -------------------------------------------------------------------------------------
;  3) Movement networking at 128 Hz + anti-speedhack.
; -------------------------------------------------------------------------------------
[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=1500000
MaxDynamicBandwidth=150000
MinDynamicBandwidth=40000
; Send client moves every server frame (7.8125 ms) regardless of client FPS.
ClientNetSendMoveDeltaTime=0.0078125
ClientNetSendMoveDeltaTimeThrottled=0.0156250
ClientNetSendMoveDeltaTimeStationary=0.0156250
ClientNetSendMoveThrottleAtNetSpeed=40000
ClientNetSendMoveThrottleOverPlayerCount=12
ClientAuthorativePosition=false
; 1.7 cm squared error before a correction: tight, competitive-grade reconciliation.
MAXPOSITIONERRORSQUARED=3.0
MAXNEARZEROVELOCITYSQUARED=9.0
; Server-side time discrepancy detection = speedhack protection for the move stream.
bMovementTimeDiscrepancyDetection=true
bMovementTimeDiscrepancyResolution=true
MovementTimeDiscrepancyMaxTimeMargin=0.25
MovementTimeDiscrepancyMinTimeMargin=-0.25
MovementTimeDiscrepancyResolutionRate=1.0
MovementTimeDiscrepancyDriftAllowance=0.0
bMovementTimeDiscrepancyForceCorrectionsDuringResolution=true

; -------------------------------------------------------------------------------------
;  4) Collision channels. Order matters: must match TacticalCollision:: in TacticalTypes.h.
;     GameTraceChannel1 = WeaponTrace  : hitscan vs. world geometry (characters IGNORE it;
;                                        they are hit via lag-compensated hitboxes instead).
;     GameTraceChannel2 = FogOcclusion : server LOS for network fog of war (world only).
;     GameTraceChannel3 = SpawnBarrier : barrier-phase walls, block Pawn only.
; -------------------------------------------------------------------------------------
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="WeaponTrace")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="FogOcclusion")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="SpawnBarrier")
+EditProfiles=(Name="Pawn",CustomResponses=((Channel="WeaponTrace",Response=ECR_Ignore),(Channel="FogOcclusion",Response=ECR_Ignore),(Channel="SpawnBarrier",Response=ECR_Block)))
+EditProfiles=(Name="CharacterMesh",CustomResponses=((Channel="WeaponTrace",Response=ECR_Ignore),(Channel="FogOcclusion",Response=ECR_Ignore)))
+EditProfiles=(Name="PhysicsActor",CustomResponses=((Channel="FogOcclusion",Response=ECR_Ignore)))
+Profiles=(Name="SpawnBarrier",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="SpawnBarrier",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Block),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="WeaponTrace",Response=ECR_Ignore),(Channel="FogOcclusion",Response=ECR_Ignore)),HelpMessage="Barrier-phase spawn walls: block pawns only.")

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
bEnableEnhancedDeterminism=true

[/Script/Engine.RendererSettings]
; -------------------------------------------------------------------------------------
;  Competitive rendering profile: readable, consistent, high frame rate.
; -------------------------------------------------------------------------------------
; Clarity: nothing that smears or hides a moving enemy.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
; Fixed exposure: a doorway looks equally bright to both players; no eye-adaptation
; flash when peeking from a dark corridor into a lit site. Lighting is authored for it.
r.DefaultFeature.AutoExposure=False
; Cheap depth cue that keeps silhouettes readable against walls.
r.DefaultFeature.AmbientOcclusion=True
; FXAA: sharp, no temporal ghosting trails behind strafing enemies (TAA/TSR smear them).
r.AntiAliasingMethod=1
; Lighting: baked GI + screen-space reflections. Lumen/VSM are beautiful but cost frame
; time and vary with hardware; a tactical shooter needs 144-360 FPS on mid-range PCs.
r.AllowStaticLighting=True
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
; Nanite for static level geometry (cheap high-detail walls/props); characters stay skeletal.
r.Nanite.ProjectEnabled=True
; GPU skin cache: 10 skinned characters + viewmodel, deform once per frame.
r.SkinCache.CompileShaders=True
r.SkinCache.DefaultBehavior=1
; Custom depth + stencil for the colour-blind-selectable enemy outline
; (stencil 1 = enemy, 2 = ally; see ATacticalCharacter::UpdateTeamHighlight).
r.CustomDepth=3
; Texture streaming with virtual textures for large lightmaps/atlases.
r.VirtualTextures=True
r.TextureStreaming=True
