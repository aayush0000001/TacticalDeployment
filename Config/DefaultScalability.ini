; =====================================================================================
;  TacticalDeployment - scalability tuned for a competitive shooter.
;
;  Rule: quality levels may change how pretty things are, never what a player can SEE.
;  Anything gameplay-relevant (character visibility, shadows cast by players, view
;  distance, effect opacity) is identical at every level, so Low settings are not an
;  advantage and Epic settings are not a handicap.
; =====================================================================================

; --- View distance: identical everywhere (a player must never pop in/out by setting) ---
[ViewDistanceQuality@0]
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0
[ViewDistanceQuality@1]
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0
[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0

; --- Shadows: dynamic character shadows exist at every level (they are information); ---
; --- only resolution/filtering scales.                                                ---
[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=0
[ShadowQuality@1]
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=0
[ShadowQuality@2]
r.ShadowQuality=4
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=3
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=1
[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=4
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=1

; --- Post-process: clarity features off at all levels; quality only scales SSR/AO. ---
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=0
r.SSR.Quality=0
[PostProcessQuality@1]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=1
r.SSR.Quality=1
[PostProcessQuality@2]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=2
r.SSR.Quality=2
[PostProcessQuality@3]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=3
r.SSR.Quality=3

; --- Textures: sharp at grazing angles (floors, walls you peek along). ---
[TextureQuality@0]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
r.Streaming.PoolSize=600
[TextureQuality@1]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.Streaming.PoolSize=1000
[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.Streaming.PoolSize=1500
[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=16
r.Streaming.PoolSize=2500

; --- Effects: smoke/sparks never become see-through or invisible by setting. ---
[EffectsQuality@0]
r.TranslucencyLightingVolume.Dim=24
r.RefractionQuality=0
r.SSS.Quality=0
fx.Niagara.QualityLevel=0
[EffectsQuality@1]
r.TranslucencyLightingVolume.Dim=32
r.RefractionQuality=0
r.SSS.Quality=0
fx.Niagara.QualityLevel=1
[EffectsQuality@2]
r.TranslucencyLightingVolume.Dim=48
r.RefractionQuality=2
r.SSS.Quality=1
fx.Niagara.QualityLevel=2
[EffectsQuality@3]
r.TranslucencyLightingVolume.Dim=64
r.RefractionQuality=2
r.SSS.Quality=1
fx.Niagara.QualityLevel=3

; --- No Lumen at any level (project uses baked GI; see DefaultEngine.ini). ---
[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0
[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=0
[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=0
